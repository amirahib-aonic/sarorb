<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGNIS</title>
  </head>
  <body>
    <main>
      <h1>IGNIS</h1>
      <p>Integrated Geospatial Network for Ignition Surveillance</p>
      <section aria-labelledby="pipeline-title">
        <h2 id="pipeline-title">Pipeline preview</h2>
        <p id="status" role="status">Loading preview data…</p>
        <ul id="sources" hidden></ul>
      </section>
      <section class="calendar" aria-labelledby="calendar-title">
        <h2 id="calendar-title">Burning Calendar</h2>
        <p id="calendar-status" role="status">Loading calendar.</p>
        <div class="calendar-scroll" tabindex="0" role="region" aria-labelledby="calendar-title">
          <table id="burning-calendar" aria-describedby="calendar-status" hidden></table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
