<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IGNIS Borneo Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="borneo.PROTOTYPE.data.js"></script>
<style>
:root{--bg:#111418;--panel:#1a1e24;--panel2:#22272f;--line:#333a44;--fg:#eceef1;--mut:#b6bfc9;--acc:#f28c38;--sb:390px;--bar:64px;--r1:6px;--r2:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:5px 9px;min-height:30px}
button:active{transform:translateY(1px)}
button{cursor:pointer}
button:hover{border-color:#4a525e}
button.on{background:#4a2c12;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#banner{position:fixed;top:0;left:0;right:0;z-index:1200;background:#5a1d1d;color:#fff;font-size:11px;padding:3px 10px;text-align:center;height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#map{position:fixed;top:22px;left:0;bottom:var(--bar);right:var(--sb);transition:right .25s}
body.collapsed #map,body.collapsed #bar{right:0}
#tools{position:fixed;top:32px;left:10px;z-index:1000;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100vw - var(--sb) - 60px);background:rgba(26,30,36,.94);border:1px solid var(--line);border-radius:var(--r2);padding:6px;box-shadow:0 4px 16px #0006}
body.collapsed #tools{max-width:calc(100vw - 60px)}
#tools .tg{display:flex;gap:4px;align-items:center}
#tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
#tools select{max-width:220px}
#tools details{position:relative}
#tools summary{list-style:none;cursor:pointer;padding:5px 9px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel2);min-height:30px;display:flex;align-items:center}
#tools summary::-webkit-details-marker{display:none}
#tools .ll{position:absolute;top:36px;left:0;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:8px;width:240px;box-shadow:0 6px 20px #0008}
#bArea,#bRng{display:none}
#bar{position:fixed;left:0;right:var(--sb);bottom:0;height:var(--bar);background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:6px 14px;transition:right .25s;z-index:900}
#label{min-width:170px;line-height:1.2}
#label b{font-size:15px;font-variant-numeric:tabular-nums}
#sub{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.sl{flex:1;min-width:160px;position:relative;padding-bottom:14px}
.sl input{width:100%;margin:0}
#ticks{position:absolute;left:8px;right:8px;bottom:0;height:12px;font-size:11px;color:var(--mut)}
#ticks span{position:absolute;transform:translateX(-50%)}
#bar .grp{display:flex;gap:6px;align-items:center}
#exp{position:relative}
#expMenu{position:absolute;bottom:40px;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:190px;box-shadow:0 6px 20px #0008}
#expMenu[hidden]{display:none}
#expMenu button{text-align:left;border:0;background:transparent}
#expMenu button:hover{background:var(--panel2)}
#mlegend{position:fixed;right:calc(var(--sb) + 10px);bottom:calc(var(--bar) + 26px);z-index:800;background:rgba(26,30,36,.94);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;font-size:12px;width:200px;transition:right .25s}
body.collapsed #mlegend{right:10px}
#mlegend .ramp{height:10px}
#mlegend .ends{display:flex;justify-content:space-between;color:var(--mut);margin-top:3px}
.bands{display:flex;gap:2px;margin-top:6px}
.bands div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bands i{display:block;height:10px;border-radius:2px;margin-bottom:2px}
#sb{position:fixed;top:22px;right:0;bottom:0;width:var(--sb);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;transition:transform .25s;z-index:950}
body.collapsed #sb{transform:translateX(100%)}
#tabs{position:fixed;top:60px;right:var(--sb);z-index:960;display:flex;flex-direction:column;gap:6px;transition:right .25s}
body.collapsed #tabs{right:0}
#tabs button{writing-mode:vertical-rl;border-radius:var(--r2) 0 0 var(--r2);border-right:0;padding:12px 7px;background:var(--panel2);color:var(--mut);display:flex;align-items:center;gap:6px}
#tabs button .ic{writing-mode:horizontal-tb;font-size:14px}
#tabs button.active{background:var(--panel);color:var(--fg);border-color:var(--line);box-shadow:inset 3px 0 0 var(--acc);margin-right:-1px}
.panel[hidden]{display:none}
h2{font-size:15px;margin:0 0 2px}
h3{font-size:12px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
h3 .w{color:#f5dc8a;cursor:help;text-transform:none;letter-spacing:0}
.note{font-size:12px;color:var(--mut)}
.warn{background:#3d3214;border:1px solid #7a6420;color:#f5dc8a;border-radius:var(--r1);padding:6px 8px;font-size:12px;margin-top:8px}
.typ{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.typ button{height:48px;min-height:0;padding:0 0 3px;border-radius:var(--r1);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px;border:1px solid transparent}
.typ button.sel{outline:2px solid #fff;outline-offset:-1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
details.dbg summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ramp{height:8px;border-radius:4px;margin-top:6px}
table.grid{border-collapse:separate;border-spacing:2px;width:100%;font-size:11px;font-variant-numeric:tabular-nums}
.grid td{height:15px;border-radius:2px;cursor:pointer;position:relative}
.grid td.inr{box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
.grid td.sel{outline:2px solid #fff;outline-offset:0}
.grid td.part{outline:1px dashed #fff;outline-offset:-1px;background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,0,0,.35) 3px 5px)!important}
.grid th{color:var(--mut);font-weight:400;text-align:right;padding-right:4px}
.grid thead th{text-align:center;padding:0}
.grid tr.modis th{color:#c9a96e}
#state{font:11px/1.4 ui-monospace,monospace;background:#0c0e11;border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap;color:#b8c0c8}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.row label{color:var(--fg)}
table.kt{border-collapse:collapse;width:100%;font-size:11px;margin-top:4px}
.kt td,.kt th{border:1px solid var(--line);padding:2px 4px;text-align:center}
#fab{position:fixed;left:10px;bottom:calc(var(--bar) + 90px);z-index:1000;border-radius:50%;width:52px;height:52px;background:var(--panel);font-size:20px;box-shadow:0 4px 14px #0007}
#coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 60px);z-index:1100;display:flex;align-items:center;gap:10px;background:#2b3240;border:1px solid var(--acc);border-radius:var(--r2);padding:8px 10px 8px 12px;box-shadow:0 6px 20px #0009;max-width:calc(100vw - 20px);font-size:13px}
#coach[hidden]{display:none}
#tip{position:fixed;z-index:1100;pointer-events:none;background:#000c;color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;display:none}
#toast{position:fixed;left:50%;top:40px;transform:translateX(-50%);z-index:1300;background:#2b3240;border:1px solid var(--line);padding:6px 12px;border-radius:6px;display:none}
#radial{position:fixed;inset:0;z-index:1250;display:none}
#radial.open{display:block}
#radial svg{position:absolute;overflow:visible;touch-action:none}
#radial.open svg{animation:pop .12s ease-out}
body.noanim,body.noanim *{transition:none!important}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#radial.open svg{animation:none}#map,#bar,#sb,#tabs,#mlegend{transition:none}}
.slice path{fill:rgba(26,30,36,.94);stroke:#3a414c;stroke-width:1.5}
.slice.sel path{fill:#4a2c12;stroke:var(--acc)}
.slice text{fill:#e8eaed;font-size:12px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.hub{fill:#0f1215;stroke:#3a414c}
.pg circle{fill:#22272f;stroke:#3a414c;cursor:pointer}
.pg.on circle{fill:var(--acc);stroke:var(--acc)}
.pg text{fill:#fff;font-size:11px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hubt{fill:#9aa3ad;font-size:10px;text-anchor:middle}
.vtx{background:#fff;border:2px solid var(--acc);border-radius:50%;width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important}
.vtx.selv{background:var(--acc)}
.mid{background:#1a1e24;border:1px solid #fff;border-radius:50%;width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important;color:#fff;font:bold 11px/12px system-ui;text-align:center}
.leaflet-container{background:#0c0e11}
@media (max-width:1280px){
:root{--bar:100px}
#bar{flex-wrap:wrap;align-content:center;gap:6px 12px}
.sl{order:5;flex-basis:100%}
#bar .grp.rng{display:none}
#bRng{display:block}
#label{flex:1;min-width:0}
body.showrng #bar .grp.rng{display:flex;flex-wrap:wrap;position:fixed;left:10px;bottom:calc(var(--bar) + 8px);z-index:1001;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;box-shadow:0 6px 20px #0008;max-width:calc(100vw - 20px)}
body.showrng #bar{z-index:1001}
}
@media (max-width:760px){
:root{--bar:112px}
#map,#bar{right:0!important}
#bar{flex-wrap:wrap;gap:6px 10px;align-content:center}
#bar .grp.rng{display:none}
#bRng{display:block}
#mode{max-width:104px}
#bar{gap:6px 6px;padding:6px 10px}
#label{min-width:92px}
body.showrng #bar .grp.rng{display:flex;flex-wrap:wrap;position:fixed;left:10px;right:10px;bottom:calc(var(--bar) + 8px);z-index:1001;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;box-shadow:0 6px 20px #0008}
body.showrng #bar .grp.rng input{flex:1;min-width:0}
body.showrng #bar{z-index:1001}
body.showrng #tabs{visibility:hidden}
#label{overflow:hidden}
#label b,#sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#label{min-width:0;flex:1}
.sl{order:5;flex-basis:100%}
#sb{top:auto;left:0;width:100%;height:62vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;bottom:var(--bar);transform:none;box-shadow:0 -8px 24px #0009}
#sb::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#555;margin:-6px auto 10px}
body.collapsed #sb{transform:translateY(calc(100% + var(--bar)))}
#tabs{top:auto;bottom:calc(var(--bar) + 8px);right:auto!important;left:50%;transform:translateX(-50%);flex-direction:row;z-index:960}
body:not(.collapsed) #tabs{bottom:calc(var(--bar) + 62vh + 8px)}
#tabs button{writing-mode:horizontal-tb;border-radius:999px;border:1px solid var(--line);padding:6px 12px;box-shadow:0 4px 14px #0007}
#tabs button.active{box-shadow:inset 0 -3px 0 var(--acc);margin:0}
#tools{max-width:calc(100vw - 20px)}
#bArea{display:block}
#tools:not(.open) .tg,#tools:not(.open) .sep,#tools:not(.open) details{display:none}
#mlegend{right:10px;top:76px;bottom:auto;width:170px}
#fab{bottom:calc(var(--bar) + 60px);left:auto;right:10px}
.leaflet-bottom.leaflet-left{bottom:calc(var(--bar) * 0 + 4px)}
}
</style>
</head>
<body class="noanim">
<div id="banner"></div>
<div id="map" role="region" aria-label="Hotspot heatmap of Borneo"></div>
<div id="tools" role="toolbar" aria-label="Area of Interest">
  <button id="bArea" aria-expanded="false">▦ Area</button>
  <span class="tg"><button id="bDraw" data-i18n="draw"></button><button id="bEdit" data-i18n="edit"></button><button id="bClear" data-i18n="clear"></button></span>
  <span class="sep"></span>
  <span class="tg"><select id="preset" aria-label="Region"></select><select id="preset2" aria-label="District" disabled></select></span>
  <details><summary>Coordinates ▾</summary><div class="ll"><input id="ll1" placeholder="lat, lng (corner 1)" aria-label="Corner 1 latitude, longitude"><input id="ll2" placeholder="lat, lng (corner 2)" aria-label="Corner 2 latitude, longitude"><button id="bLL">Apply corners</button></div></details>
</div>
<div id="mlegend" aria-live="polite"></div>
<div id="coach" role="status" hidden><span id="coachText"></span><button id="coachOk">Got it</button></div>
<div id="bar">
  <button id="play" aria-label="Play">▶</button>
  <div id="label"><b id="when"></b><div id="sub"></div></div>
  <div class="sl"><input type="range" id="slider" min="0" aria-label="Month"><div id="ticks" aria-hidden="true"></div></div>
  <select id="mode" aria-label="Map mode"></select>
  <div class="grp rng"><span class="note" data-i18n="range"></span><input type="date" id="from" aria-label="From"><span class="note">→</span><input type="date" id="to" aria-label="To"></div>
  <button id="bRng" aria-expanded="false" aria-controls="from">Dates</button>
  <div id="exp"><button id="bExp" aria-haspopup="menu" aria-expanded="false">Export ▾</button><div id="expMenu" role="menu" hidden><button id="bRaw" role="menuitem" data-i18n="csvRaw"></button><button id="bHarm" role="menuitem" data-i18n="csvHarm"></button></div></div>
</div>
<div id="tabs">
  <button id="tCal" data-tab="cal"></button>
  <button id="tSet" data-tab="set"></button>
</div>
<aside id="sb">
  <section class="panel" id="pCal">
    <h2 id="aoiName"></h2>
    <div class="note" id="aoiNote"></div>
    <div id="lowData"></div>
    <h3><span data-i18n="typical"></span><span class="w" id="lowIcon"></span></h3>
    <div class="typ" id="typ"></div>
    <div class="legend" id="phaseLegend"></div>
    <h3 id="gridTitle"></h3>
    <table class="grid" id="grid"></table>
    <div class="bands" id="gridRamp"></div>
    <div class="note" style="margin-top:8px" data-i18n="gridNote"></div>
    <details class="dbg"><summary>Debug state</summary><div id="state"></div></details>
  </section>
  <section class="panel" id="pSet" hidden>
    <h2 data-i18n="settings"></h2>
    <div class="row"><label for="sLang" data-i18n="language"></label><select id="sLang"><option value="en">English</option><option value="ms">Bahasa Malaysia</option><option value="id">Bahasa Indonesia</option><option value="iba">Iban</option></select></div>
    <div id="ibaNote"></div>
    <div class="row"><label for="sPal" data-i18n="palette"></label><select id="sPal"><option value="default">Default</option><option value="cb">Colour-blind safe</option></select></div>
    <h3 data-i18n="wheel"></h3>
    <div class="row"><label for="sLp" data-i18n="lpDelay"></label><select id="sLp"><option>300</option><option>500</option><option>800</option></select></div>
    <div class="row"><label for="sKey" data-i18n="wheelKey"></label><input id="sKey" maxlength="1" style="width:48px;text-align:center"></div>
    <div class="row"><label for="sStart" data-i18n="wheelStart"></label><select id="sStart"><option value="last">Last used page</option><option value="first">Page 1</option></select></div>
    <h3 data-i18n="mapH"></h3>
    <div class="row"><label for="sBase" data-i18n="basemap"></label><select id="sBase"><option value="dark">Dark</option><option value="light">Light</option><option value="sat">Satellite</option></select></div>
    <div class="row"><label for="sOp" data-i18n="opacity"></label><input type="range" id="sOp" min="0.2" max="1" step="0.05"></div>
    <h3 data-i18n="about"></h3>
    <div class="note" id="about"></div>
  </section>
</aside>
<div id="radial" role="menu" aria-label="Tool wheel"><svg id="rsvg" width="300" height="300" viewBox="-150 -150 300 300"></svg></div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<script>
const D=window.PROTO_DATA,NC=D.cells.length,keys=Object.keys(D.months).sort(),NM=keys.length,CUR=D.current;

const lerp=(stops,x)=>{x=Math.max(0,Math.min(1,x))*(stops.length-1);const i=Math.min(stops.length-2,Math.floor(x)),f=x-i;const a=stops[i].match(/\w\w/g).map(h=>parseInt(h,16)),b=stops[i+1].match(/\w\w/g).map(h=>parseInt(h,16));return`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*f))})`};

function computeAoi(){
  const g=st.aoi?st.aoi.kind==="drawn"?{type:"Polygon",coordinates:[st.aoi.pts.map(([a,b])=>[b,a])]}:st.aoi.geom:null;
  st.aoiCells=g?Int32Array.from([...Array(NC).keys()].filter(c=>{const[la,ln]=cc(c);return inGeom(ln,la,g)})):null;
  SER=new Float64Array(NM);PSER={};
  for(let i=0;i<NM;i++){let s=0;const o=i*NC;if(st.aoiCells)for(const c of st.aoiCells)s+=H[o+c];else for(let c=0;c<NC;c++)s+=H[o+c];SER[i]=s}
  for(const k in PART){const a=PART[k];let s=0;if(st.aoiCells)for(const c of st.aoiCells)s+=a[c];else for(let c=0;c<NC;c++)s+=a[c];PSER[k]=s}
}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const typical=(m,excl)=>mean(years.filter(y=>y!==excl).map(y=>key(y,m)).filter(k=>k in kIdx&&k!==CUR).map(k=>SER[kIdx[k]]));
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
const baseline=(m,excl)=>median(years.filter(y=>y!==excl).map(y=>key(y,m)).filter(k=>k in kIdx&&k!==CUR).map(k=>SER[kIdx[k]]));

const phaseKey=s=>s>=.15?"peak":s>=.08?"active":s>=.04?"moderate":"lowp";

const NB=D.cells.map(([x,y])=>{const o=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const c=cellId.get((x+dx)+","+(y+dy));if(c!=null)o.push(c)}return Int32Array.from(o)});
function box(a){const b=new Float64Array(NC);for(let c=0;c<NC;c++){let s=0;for(const n of NB[c])s+=a[n];b[c]=s}return b}

function cellValues(){
  const v=new Float32Array(NC),k=keys[st.idx],m=kM(k),y=kY(k),cs=st.aoiCells||null;
  if(st.mode==="month"){v.set(H.subarray(st.idx*NC,(st.idx+1)*NC))}
  else if(st.mode==="range"){keys.forEach((kk,i)=>{if(inRange(kk))for(let c=0;c<NC;c++)v[c]+=H[i*NC+c]})}
  else{
    const ys=years.map(yy=>key(yy,m)).filter(kk=>kk in kIdx&&kk!==CUR);
    if(st.mode==="typical"){ys.forEach(kk=>{const o=kIdx[kk]*NC;for(let c=0;c<NC;c++)v[c]+=H[o+c]/ys.length})}
    else{
      const part=k===CUR,src=part?ys.filter(kk=>kY(kk)!==y&&kk in PART).map(kk=>PART[kk]):ys.filter(kk=>kY(kk)!==y).map(kk=>H.subarray(kIdx[kk]*NC,(kIdx[kk]+1)*NC));
      const cur=part?PART[k]:H.subarray(st.idx*NC,(st.idx+1)*NC);
      const x=box(cur),mb=new Float64Array(NC),fr=new Uint8Array(NC);
      src.forEach(a=>{const b=box(a);for(let c=0;c<NC;c++){mb[c]+=b[c]/src.length;if(a[c]>0)fr[c]++}});
      let mu=0;for(let c=0;c<NC;c++)mu+=mb[c]/NC;
      for(let c=0;c<NC;c++)v[c]=cur[c]>0?(x[c]+mu)/(mb[c]+mu):0;

function drawRadial(){

function setPage(p){if(R.menu===SHAPE)return;R.page=(p+3)%3;set.page=R.page;save();R.menu=PAGES[R.page];R.sel=0;drawRadial()}
function choose(i){const id=R.menu.items[i],ll=R.ll;closeRadial();if(id)ACT[id].f(ll)}
function sliceAt(cx,cy){const dx=cx-R.x,dy=cy-R.y,d=Math.hypot(dx,dy);if(d<RI||d>RO+40)return-1;const n=R.menu.items.length,step=2*Math.PI/n;let a=Math.atan2(dy,dx)+Math.PI/2+step/2;a=(a%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(a/step)%n}
rad.addEventListener("pointermove",e=>{const s=sliceAt(e.clientX,e.clientY);if(s!==R.sel&&s>=0){R.sel=s;drawRadial()}});
rad.addEventListener("pointerup",e=>{const pg=e.target.closest(".pg");if(pg){setPage(+pg.dataset.p);return}const s=sliceAt(e.clientX,e.clientY);if(s>=0)choose(s);else if(Math.hypot(e.clientX-R.x,e.clientY-R.y)>RO+40)closeRadial();R.drag=false});
rad.addEventListener("wheel",e=>{e.preventDefault();setPage(R.page+(e.deltaY>0?1:-1))},{passive:false});
rad.addEventListener("contextmenu",e=>e.preventDefault());
map.on("contextmenu",e=>{if(R.open)return;openRadial(e.originalEvent.clientX,e.originalEvent.clientY,"map",e.latlng)});
let lp=null,lpXY=null;
mapEl.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"||st.draw)return;lpXY=[e.clientX,e.clientY];clearTimeout(lp);lp=setTimeout(()=>{openRadial(lpXY[0],lpXY[1],"map",map.mouseEventToLatLng(e));R.drag=true;R.sel=-1;drawRadial()},+set.lp)});
mapEl.addEventListener("pointermove",e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10)clearTimeout(lp)});
["pointerup","pointercancel"].forEach(ev=>mapEl.addEventListener(ev,()=>{clearTimeout(lp);lpXY=null}));
document.addEventListener("pointerup",e=>{if(R.open&&R.drag){const s=sliceAt(e.clientX,e.clientY);R.drag=false;if(s>=0&&Math.hypot(e.clientX-R.x,e.clientY-R.y)>RI)choose(s)}});
let lastPtr=null;document.addEventListener("pointermove",e=>{if(mapEl.contains(e.target))lastPtr=[e.clientX,e.clientY]});
const touch=matchMedia("(pointer: coarse)").matches;
let seen=false;try{seen=localStorage.getItem("ignis-proto-coach")==="1"}catch(e){}
const coach=document.getElementById("coach");
document.getElementById("coachText").textContent=touch?"Tip: press and hold the map to open the tool wheel.":`Tip: right-click the map or press ${set.key.toUpperCase()} to open the tool wheel.`;
const coachDone=()=>{coach.hidden=true;try{localStorage.setItem("ignis-proto-coach","1")}catch(e){}};
document.getElementById("coachOk").onclick=coachDone;
if(!seen)setTimeout(()=>coach.hidden=false,1200);
document.addEventListener("keydown",e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(R.open){const n=R.menu.items.length;
    if(e.key==="Escape")closeRadial();else if(/^[1-3]$/.test(e.key))setPage(+e.key-1);
    else if(e.key==="ArrowRight"||e.key==="ArrowDown"){R.sel=(R.sel+1)%n;drawRadial()}else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){R.sel=(R.sel-1+n)%n;drawRadial()}
    else if(e.key==="Enter"||e.key===" ")choose(R.sel);else return;e.preventDefault();return}
  if(typing)return;
  if(e.key.toLowerCase()===set.key.toLowerCase()){const p=lastPtr||[mapEl.clientWidth/2,mapEl.clientHeight/2+22];openRadial(p[0],p[1],st.aoi&&st.edit?"shape":"map");e.preventDefault()}
  else if((e.key==="Delete"||e.key==="Backspace")&&st.edit&&st.selV!=null){delVertex(st.selV);e.preventDefault()}
  else if(e.key==="Escape"&&st.draw){st.draw=false;map.dragging.enable();mapEl.style.cursor="";syncButtons()}
});

function setMode(m){st.mode=m;document.getElementById("mode").value=m;render()}
function openTab(tab){if(st.collapsed||st.tab!==tab){st.tab=tab;st.collapsed=false}else st.collapsed=true;applyTabs()}
function applyTabs(){document.body.classList.toggle("collapsed",st.collapsed);document.getElementById("pCal").hidden=st.tab!=="cal";document.getElementById("pSet").hidden=st.tab!=="set";
  document.getElementById("tCal").innerHTML=`<span class="ic" aria-hidden="true">▦</span>${t("cal")}`;document.getElementById("tSet").innerHTML=`<span class="ic" aria-hidden="true">⚙</span>${t("settings")}`;
  ["tCal","tSet"].forEach(id=>{const b=document.getElementById(id);const on=!st.collapsed&&b.dataset.tab===st.tab;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on)});
  setTimeout(()=>{map.invalidateSize();drawCanvas()},260)}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>openTab(b.dataset.tab));

function csv(kind){
  const a=st.from.slice(0,7),b=st.to.slice(0,7),ks=keys.filter(inRange),cs=st.aoiCells||Int32Array.from(Array(NC).keys());
  let rows;
  if(kind==="harm"){rows=[["year","month","harmonized_hotspot_count","source_sensor","factor","partial"]];ks.forEach(k=>{const r=D.months[k];rows.push([kY(k),kM(k),SER[kIdx[k]].toFixed(1),r.s,r.w,k===CUR?`days 1-${D.cutDay}`:""])})}
  else{rows=[["year","month","cell_lat","cell_lng","sensor","hotspots"]];ks.forEach(k=>{const i=kIdx[k],r=D.months[k];for(const c of cs){const n=RW[i*NC+c];if(n){const[la,ln]=cc(c);rows.push([kY(k),kM(k),la.toFixed(2),ln.toFixed(2),r.s,n])}}})}
  const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}),u=URL.createObjectURL(blob),el=document.createElement("a");
  el.href=u;el.download=`ignis_${kind==="harm"?"harmonized":"hotspots"}_${(st.aoi?st.aoi.name:"borneo").replace(/\W+/g,"_")}_${a}_${b}.csv`;el.click();URL.revokeObjectURL(u);
  const dayCut=st.from.slice(8)!=="01"||st.to!==new Date(+st.to.slice(0,4),+st.to.slice(5,7),0).toISOString().slice(0,10);
  toast(dayCut?`Rounded to whole months (${a} to ${b})${kind==="raw"?" — prototype exports per 0.1° cell, not single Hotspots":""}`:`Downloaded ${rows.length-1} rows`);
}

function drawCalendar(){
  const k=keys[st.idx],m=kM(k),M=mn(),pal=PAL[set.pal];
  document.getElementById("aoiName").textContent=st.aoi?st.aoi.name:t("borneo");
  document.getElementById("aoiNote").textContent=`${st.aoiCells?st.aoiCells.length:NC} cells · harmonized ${GRID0}–${CUR.slice(0,4)} · data to ${D.lastDate}`;
  const typ=Array.from({length:12},(_,i)=>typical(i+1,null)),tot=typ.reduce((a,b)=>a+b,0),low=tot<LOW;
  document.getElementById("lowData").innerHTML=low?`<div class="warn">⚠ ${t("low")}</div>`:"";
  const li=document.getElementById("lowIcon");li.textContent=low?"⚠ low data":"";li.title=low?t("low"):"";
  document.getElementById("typ").innerHTML=typ.map((v,i)=>{const p=phaseKey(tot?v/tot:0),bg=low?"#30353d":pal.phase[p];return`<button data-m="${i+1}" class="${i+1===m?"sel":""}" style="background:${bg};color:${low||p==="lowp"?"var(--mut)":"#111"}" title="${M[i]}: ${t(p)} · ${tot?(v/tot*100).toFixed(1):0}% · ${Math.round(v)} avg" aria-label="${M[i]} ${t(p)}">${M[i][0]}</button>`}).join("");
  document.getElementById("phaseLegend").innerHTML=["peak","active","moderate","lowp"].map((p,i)=>`<span><i style="background:${low?"#30353d":pal.phase[p]}"></i>${t(p)} ${["≥15%","≥8%","≥4%",""][i]}</span>`).join("");
  const an=st.mode==="anomaly";
  const sv=keys.filter(kk=>kY(kk)>=GRID0&&kk!==CUR).map(kk=>SER[kIdx[kk]]).sort((a,b)=>a-b),NB=7;
  const th=Array.from({length:NB-1},(_,i)=>sv[Math.floor(sv.length*(i+1)/NB)]||0);
  const band=v=>th.filter(x=>v>=x).length,bcol=b=>lerp(pal.heat,b/(NB-1));
  document.getElementById("gridTitle").textContent=t(an?"gridAnom":"gridCounts");
  document.getElementById("gridRamp").innerHTML=an?["¼×","½×","1×","2×","4×"].map((l,i)=>`<div><i style="background:${DIV[i]}"></i>${l}</div>`).join(""):Array.from({length:NB},(_,b)=>`<div><i style="background:${bcol(b)}"></i>${b?fmt(th[b-1]):"0"}+</div>`).join("");
  let h="<thead><tr><th></th>"+M.map(n=>`<th>${n[0]}</th>`).join("")+"</tr></thead><tbody>";
  years.filter(y=>y>=GRID0).reverse().forEach(y=>{const modis=[...Array(12)].some((_,i)=>D.months[key(y,i+1)]?.s==="MODIS");h+=`<tr class="${modis?"modis":""}"><th>${y}</th>`;
    for(let mm=1;mm<=12;mm++){const kk=key(y,mm);if(!(kk in kIdx)){h+=`<td style="background:#0c0e11;cursor:default"></td>`;continue}
      const v=SER[kIdx[kk]],r=an?anomaly(kk):null,bg=an?(r==null?"#30353d":div(r)):bcol(band(v)),cls=[kk===k?"sel":"",inRange(kk)?"inr":"",kk===CUR?"part":""].join(" ");
      h+=`<td data-k="${kk}" class="${cls}" style="background:${bg}" title="${M[mm-1]} ${y}: ${Math.round(v)} VIIRS-eq${r!=null?` · ${r.toFixed(2)}× ${t("normal")}`:""} (${D.months[kk].s})${kk===CUR?` · ${t("partial")} 1–${D.cutDay}`:""}"></td>`}
    h+="</tr>"});
  document.getElementById("grid").innerHTML=h+"</tbody>";
  return{typ,tot,low};
}

function render(){
  const k=keys[st.idx],r=D.months[k],y=kY(k),m=kM(k),M=mn();
  VALS=cellValues();VMAX=st.mode==="month"?MAXCELL:Math.max(1,...VALS.filter(v=>!Number.isNaN(v)));drawCanvas();
  document.getElementById("slider").value=st.idx;
  const cal=drawCalendar(),an=anomaly(k),part=k===CUR;
  const when={month:`${M[m-1]} ${y}${part?` (${t("partial")} 1–${D.cutDay})`:""}`,range:`${st.from} → ${st.to}`,typical:`${t("typicalYear")}: ${M[m-1]}`,anomaly:`${t("anomaly")}: ${M[m-1]} ${y}${part?` (${t("partial")})`:""}`}[st.mode];
  const sub={month:`${Math.round(SER[st.idx])} VIIRS-eq · ${r.s}${r.s==="MODIS"?` × k=${D.k[m].toFixed(2)}`:r.s==="VIIRS NOAA-20"?` ÷ ${D.r}`:""}`,range:`${Math.round(keys.reduce((s,kk,i)=>s+(inRange(kk)?SER[i]:0),0))} VIIRS-eq in range (whole months)`,typical:`${Math.round(cal.typ[m-1])} avg · ${t(phaseKey(cal.tot?cal.typ[m-1]/cal.tot:0))}`,anomaly:an==null?"no baseline":`${an.toFixed(2)}× ${t("normal")}${part?` vs 1–${D.cutDay} ${M[m-1]} in past years`:""}`}[st.mode];
  document.getElementById("when").textContent=when;document.getElementById("sub").textContent=sub;
  const pal=PAL[set.pal],lg=document.getElementById("mlegend");
  lg.innerHTML=st.mode==="anomaly"?`<b>${t("anomaly")}</b><div class="bands">${["¼×","½×","1×","2×","4×"].map((l,i)=>`<div><i style="background:${DIV[i]}"></i>${l}</div>`).join("")}</div><div class="note" style="margin-top:4px">Red cells with no history = new fire</div>`
    :`<b>${{month:"VIIRS-eq Hotspots / cell",range:"Hotspots / cell, range total",typical:"Avg Hotspots / cell"}[st.mode]}</b><div class="ramp" style="background:linear-gradient(90deg,${pal.heat.join(",")})"></div><div class="ends"><span>1</span><span>${fmt(VMAX)}</span></div><div class="note">log scale</div>`;
  document.getElementById("state").textContent=JSON.stringify({aoi:st.aoi?{kind:st.aoi.kind,name:st.aoi.name,points:st.aoi.pts?.length}:"Borneo",cells:st.aoiCells?st.aoiCells.length:NC,month:k,mode:st.mode,source:r.s,factor:r.w,harmonized:+SER[st.idx].toFixed(1),anomaly:an&&+an.toFixed(2),partial:part,range:[st.from,st.to],lowData:cal.low,typicalAnnual:Math.round(cal.tot),editing:st.edit,drawing:st.draw,selectedPoint:st.selV,sidebar:st.collapsed?"collapsed":st.tab,settings:set},null,1);
}

function applySettings(){
  document.documentElement.lang=set.lang==="iba"?"iba":set.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.getElementById("banner").textContent=t("banner");
  document.getElementById("ibaNote").innerHTML=set.lang==="iba"?`<div class="warn">Iban strings are not written yet — showing Bahasa Malaysia until a native speaker reviews the translation.</div>`:"";
  document.getElementById("mode").innerHTML=[["month","month"],["range","rangeTotal"],["typical","typicalYear"],["anomaly","anomaly"]].map(([v,l])=>`<option value="${v}">${t(l)}</option>`).join("");
  document.getElementById("mode").value=st.mode;
  fillPresets();
  setBase();applyTabs();
  const kt=Object.entries(D.k);
  document.getElementById("about").innerHTML=`Harmonized Hotspot Count = S-NPP if observed, else NOAA-20 ÷ ${D.r}, else MODIS × k(m). k(m) fitted once on all of Borneo, 2012 onward (ADR 0001).<table class="kt"><tr>${kt.map(([m])=>`<th>${mn()[m-1]}</th>`).join("")}</tr><tr>${kt.map(([,v])=>`<td>${v.toFixed(2)}</td>`).join("")}</tr></table><p>Burning Phase: Peak ≥15%, Active ≥8%, Moderate ≥4% of a Typical Year. Low-data warning under ${LOW} Hotspots a year. Anomaly = month ÷ median of the same calendar month in the other years; on the map each cell uses its 5×5 neighbourhood shrunk toward Borneo (ADR 0002); the current month compares days 1–${D.cutDay} only. Data to ${D.lastDate}.</p>`;
  render();
}
const MAXCELL=H.reduce((a,b)=>b>a?b:a,1);
const bind=(id,k,ev="change")=>{const el=document.getElementById(id);el.value=set[k];el.addEventListener(ev,()=>{set[k]=el.value;save();applySettings()})};
bind("sLang","lang");bind("sPal","pal");bind("sLp","lp");bind("sKey","key","input");bind("sStart","start");bind("sBase","base");bind("sOp","op","input");
const slider=document.getElementById("slider");slider.max=NM-1;slider.oninput=e=>{st.idx=+e.target.value;render()};
document.getElementById("mode").onchange=e=>setMode(e.target.value);
document.getElementById("from").value=st.from;document.getElementById("to").value=st.to;
["from","to"].forEach(id=>document.getElementById(id).onchange=e=>{st[id]=e.target.value||st[id];if(st.from>st.to)[st.from,st.to]=[st.to,st.from];render()});
document.getElementById("typ").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=key(kY(keys[st.idx]),+b.dataset.m);st.idx=k in kIdx?kIdx[k]:st.idx;setMode("typical")};
document.getElementById("grid").onclick=e=>{const k=e.target.dataset.k;if(!k)return;st.idx=kIdx[k];if(st.mode==="typical"||st.mode==="range")st.mode="month";document.getElementById("mode").value=st.mode;render()};
document.getElementById("bDraw").onclick=startDraw;document.getElementById("bEdit").onclick=startEdit;document.getElementById("bClear").onclick=clearAoi;document.getElementById("bLL").onclick=applyLL;
const expMenu=document.getElementById("expMenu"),bExp=document.getElementById("bExp");
const expShow=v=>{expMenu.hidden=!v;bExp.setAttribute("aria-expanded",v)};
bExp.onclick=e=>{e.stopPropagation();expShow(expMenu.hidden)};document.addEventListener("click",()=>expShow(false));
document.getElementById("bRaw").onclick=()=>{expShow(false);csv("raw")};document.getElementById("bHarm").onclick=()=>{expShow(false);csv("harm")};
const bRng=document.getElementById("bRng");
function showRange(v){document.body.classList.toggle("showrng",v);bRng.setAttribute("aria-expanded",v);if(v)setTimeout(()=>document.getElementById("from").focus(),0)}
bRng.onclick=e=>{e.stopPropagation();showRange(!document.body.classList.contains("showrng"))};
document.querySelector("#bar .grp.rng").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>showRange(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("showrng")){showRange(false);bRng.focus()}});
const bArea=document.getElementById("bArea"),toolsEl=document.getElementById("tools");
bArea.onclick=()=>{const o=toolsEl.classList.toggle("open");bArea.setAttribute("aria-expanded",o)};
document.getElementById("ticks").innerHTML=years.filter(y=>y%5===0).map(y=>{const i=kIdx[key(y,1)]??kIdx[key(y,2)];return i==null?"":`<span style="left:${(i/(NM-1)*100).toFixed(2)}%">${y}</span>`}).join("");
let timer;document.getElementById("play").onclick=e=>{st.playing=!st.playing;e.target.textContent=st.playing?"❚❚":"▶";clearInterval(timer);if(st.playing)timer=setInterval(()=>{st.idx=(st.idx+1)%NM;render()},450)};
computeAoi();applySettings();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove("noanim")));
</script>
